<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silksong Boss Challenges</title>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <div id="flex-container">
        <div id="boss-container">
            <img src="/silksong-challenges/images/hornet.png" alt="" id="boss-img">
            <h2 id="boss-text"></h2>
        </div>
        <div id="crest-container">
            <img src="/silksong-challenges/images/crests/hunter.png" alt="crest image" id="crest-img">
        </div>
        <div id="toolBank"></div>
    </div>

    <div id="controlBar">
        <div style="padding: 0 40px;">
            <button id="randomBoss">Boss</button>
            <button id="randomCrest">Crest</button>
            <button id="randomTools">Tools</button>
            <button id="randomAll">All</button>
        </div>
        <div style="padding: 0 40px;">
            <button id="randomRed">R</button>
            <button id="randomBlue">B</button>
            <button id="randomYellow">Y</button>
            <button id="randomWhite">S</button>
        </div>
    </div>
</body>
<script src="https://interstellar717.github.io/Utility.js"></script>
<script src="ToolSlot.js"></script>
<script src="VariableCrest.js"></script>
<script src="index.js"></script>

</html>
