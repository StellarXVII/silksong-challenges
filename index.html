<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silksong Boss Challenges</title>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <div id="flex-container">
        <div id="boss-container">
            <img src="/silksong-challenges/images/hornet.png" alt="" id="boss-img">
            <h2 id="boss-text"></h2>
        </div>
        <div id="crest-container">
            <div>
                <img src="/silksong-challenges/images/crests/vesticrest.png" alt="crest image" id="vesticrest-img">
                <img src="/silksong-challenges/images/crests/hunter.png" alt="crest image" id="crest-img">
            </div>
        </div>
        <div id="toolBank"></div>
    </div>

    <div id="controlBar">
        <div id="crest-moveset-container">
            <div class="randomized-field-container"><span class="moveset-field-label"
                    id="moveset-bind-action-label">BindingAction:&nbsp;&nbsp;</span><span
                    class="randomized-moveset-field" id="bind-action">Hunter</span></div>
            <div class="randomized-field-container"><span class="moveset-field-label"
                    id="moveset-pogo-label">DownAttack:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span
                    class="randomized-moveset-field" id="moveset-pogo">Hunter</span></div>
            <div class="randomized-field-container"><span class="moveset-field-label"
                    id="moveset-normal-label">NeutralAttack:&nbsp;&nbsp;</span><span class="randomized-moveset-field"
                    id="moveset-normal">Hunter</span></div>
            <div class="randomized-field-container"><span class="moveset-field-label"
                    id="moveset-up-label">UpAttack:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span
                    class="randomized-moveset-field" id="moveset-up">Hunter</span></div>
        </div>
        <div id="controlBarButtonsDiv">
            <button id="randomAll" style="width: 100%">All</button>
            <button id="randomBoss">Boss</button>
            <button id="randomCrest">Crest</button>
            <button id="randomTools">Tools</button>
            <!-- NOT WORKING; IGNORES VESTICREST: SOMETIMES FILLS ONLY ONE SLOT, SOMETIMES NONE -->
            <!-- <button id="randomFill">Fill Spaces</button> -->
            <label for="standardCrestTemplateToggle">Standard Crest Templates</label><input type="checkbox"
                id="standardCrestTemplateToggle" name="standardCrestTemplateToggle" checked>
        </div>
    </div>
</body>
<script src="/Utility.js"></script>
<script src="ToolSlot.js"></script>
<script src="VariableCrest.js"></script>
<script src="index.js"></script>

</html>
